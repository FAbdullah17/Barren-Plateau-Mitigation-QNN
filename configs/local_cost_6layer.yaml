# Local-cost approach - depth 6 (8 qubits).

experiment:
  name: local_cost_6layer
  approach: local_cost

model:
  n_qubits: 8
  n_layers: 6

training:
  optimizer: adam
  learning_rate: 0.01
  batch_size: 20
  total_updates: 2500
  cost_function: local

data:
  dataset: mnist
  digit1: 3
  digit2: 6
  train_size: 1000
  test_size: 200
  image_size: [4, 4]
  preprocessing: pca
  n_components: 8
  encoding: ry_angle

seeds:
  seed_triples: 20
  base_seed: 42

metrics:
  track_gradients: true
  log_frequency: 10

analysis:
  min_variance_separation_se: 2.0
  qubit_counts: [4, 6, 8]
  alpha: 0.05
  multiple_comparison: holm

output:
  results_dir: results/local_cost/depth_6
  save_plot: true
  checkpoint_frequency: 500