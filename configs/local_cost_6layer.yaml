# Local Cost Function Approach - 6 Layer Circuit
# Standard end-to-end training with local cost function
# Testing polynomial gradient scaling at increased depth
#
# ASSIGNED TO: Frahan Riaz (Week 8 - 5 runs)

experiment:
  name: "local_cost_6layer"
  approach: "local_cost"
  description: "End-to-end training with local cost function on 6-layer circuit"

model:
  n_qubits: 4
  n_layers: 6  # Increased to 6 layers
  circuit_type: "hardware_efficient"
  data_reuploading: false

training:
  optimizer: "adam"
  learning_rate: 0.01
  batch_size: 20
  epochs: 50
  cost_function: "local"  # Average per-qubit measurements
  local_cost: true

data:
  dataset: "mnist"
  digit1: 3
  digit2: 6
  train_size: 1000
  test_size: 200
  image_size: [4, 4]
  normalization: "min_max"  # Scale to [0, 1]
  preprocessing: "downsample_bilinear"

quantum:
  shots: 1024
  backend: "cirq_simulator"
  
metrics:
  track_gradients: true
  gradient_variance: true
  gradient_norm: true
  barren_plateau_threshold: 1.0e-6
  success_threshold: 90.0  # Percentage

random_seeds: [42, 123, 456, 789, 101112]

output:
  results_dir: "results/local_cost/depth_6"
  save_checkpoints: true
  save_gradients: true
  log_frequency: 1  # Log every epoch

# Expected behavior: Polynomial gradient scaling, better than baseline at 6 layers
