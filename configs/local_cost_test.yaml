# Local-cost smoke-test config. Small sizes for quick runs.

experiment:
  name: local_cost_test
  approach: local_cost

model:
  n_qubits: 8
  n_layers: 2

training:
  optimizer: adam
  learning_rate: 0.01
  batch_size: 20
  total_updates: 40
  cost_function: local

data:
  dataset: mnist
  digit1: 3
  digit2: 6
  train_size: 100
  test_size: 50
  image_size: [4, 4]
  preprocessing: pca
  n_components: 8
  encoding: ry_angle

seeds:
  seed_triples: 2
  base_seed: 42

metrics:
  track_gradients: true
  log_frequency: 10

output:
  results_dir: results/local_cost/test
  save_plot: true
  checkpoint_frequency: 20
