# Layerwise Training Approach - 4 Layer Configuration
# Incremental layer-by-layer training with parameter freezing
#
#

experiment:
  name: "layerwise_4layer"
  approach: "layerwise"
  description: "Layerwise training on 4-layer quantum circuit (Skolik et al. 2020)"

model:
  n_qubits: 4
  target_layers: 4
  circuit_type: "hardware_efficient"
  data_reuploading: false

training:
  optimizer: "adam"
  learning_rate: 0.01
  batch_size: 20
  epochs_per_layer: 10
  finetune_epochs: 10
  cost_function: "global"
  local_cost: false
  freezing_strategy: "immediate"  # Freeze after each layer trained

data:
  dataset: "mnist"
  digit1: 3
  digit2: 6
  train_size: 1000
  test_size: 200
  image_size: [4, 4]
  normalization: "min_max"
  preprocessing: "downsample_bilinear"

quantum:
  shots: 1024
  backend: "cirq_simulator"
  
metrics:
  track_gradients: true
  gradient_variance: true
  gradient_norm: true
  barren_plateau_threshold: 1.0e-6
  success_threshold: 90.0
  track_per_layer: true  # Track gradient behavior per layer

random_seeds: [42, 123, 456, 789, 101112]

output:
  results_dir: "results/layerwise/depth_4"
  save_checkpoints: true
  save_gradients: true
  log_frequency: 1

# Training schedule:
# Epochs 1-10: Train layer 1 only
# Epochs 11-20: Train layer 2 only (layer 1 frozen)
# Epochs 21-30: Train layer 3 only (layers 1-2 frozen)
# Epochs 31-40: Train layer 4 only (layers 1-3 frozen)
# Epochs 41-50: Fine-tune all layers (unfreeze all)
