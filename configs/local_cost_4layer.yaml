# Local Cost Function Approach
# Standard end-to-end training with local (per-qubit) cost function
# Fixed at 4 layers to compare against baseline with same architecture
#
#

experiment:
  name: "local_cost"
  approach: "local_cost"
  description: "End-to-end training on 4-layer circuit with local cost function (Cerezo et al. 2021)"

model:
  n_qubits: 4
  n_layers: 4  # FIXED at 4 layers (same as baseline for direct comparison)
  circuit_type: "hardware_efficient"
  data_reuploading: false

training:
  optimizer: "adam"
  learning_rate: 0.01
  batch_size: 20
  epochs: 50
  cost_function: "local"  # Average per-qubit measurements
  local_cost: true

data:
  dataset: "mnist"
  digit1: 3
  digit2: 6
  train_size: 1000
  test_size: 200
  image_size: [4, 4]
  normalization: "min_max"
  preprocessing: "downsample_bilinear"

quantum:
  shots: 1024
  backend: "cirq_simulator"
  
metrics:
  track_gradients: true
  gradient_variance: true
  gradient_norm: true
  barren_plateau_threshold: 1.0e-6
  success_threshold: 90.0

random_seeds: [42, 123, 456, 789, 101112]

output:
  results_dir: "results/local_cost/depth_4"
  save_checkpoints: true
  save_gradients: true
  log_frequency: 1

# Local cost function:
# C_local = (1/n_qubits) * Σᵢ ⟨Zᵢ⟩
# Measure each qubit independently, average the results
# Theoretical guarantee: Var[∇θC] ∝ poly(n) instead of exp(-n)
