# Test configuration for quick validation
# Reduced epochs and samples for fast testing

experiment:
  name: "baseline_test"
  approach: "baseline"
  description: "Quick test run"

model:
  n_qubits: 4
  n_layers: 4
  circuit_type: "hardware_efficient"
  data_reuploading: false

training:
  optimizer: "adam"
  learning_rate: 0.01
  batch_size: 20
  epochs: 3  # Reduced for testing
  cost_function: "global"
  local_cost: false

data:
  dataset: "mnist"
  digit1: 3
  digit2: 6
  train_size: 100  # Reduced for testing
  test_size: 50    # Reduced for testing
  image_size: [4, 4]
  normalization: "min_max"
  preprocessing: "downsample_bilinear"

quantum:
  shots: 1024
  backend: "cirq_simulator"
  
metrics:
  track_gradients: true
  gradient_variance: true
  gradient_norm: true
  barren_plateau_threshold: 1.0e-6
  success_threshold: 90.0

random_seeds: [42]

output:
  results_dir: "results/baseline/test"
  save_checkpoints: true
  save_gradients: true
  log_frequency: 1
